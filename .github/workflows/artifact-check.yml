# Temporary (2026-10-23): can the Actions token download another public repo's artifact? Delete after one run.
name: artifact-check
on: workflow_dispatch
permissions: { contents: read, actions: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          id=$(gh api repos/openrac/rac2-gc-decomp/actions/artifacts --jq '[.artifacts[] | select(.expired|not)][0].id')
          echo "artifact $id"
          curl -sL -o a.zip -w "download http %{http_code} bytes %{size_download}\n" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/openrac/rac2-gc-decomp/actions/artifacts/$id/zip"
