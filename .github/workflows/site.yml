# Daily: snapshot GitHub stats for every tracked repo, commit them, build, deploy as Workers static assets (worker: recompsoftware, apps/web/wrangler.jsonc).
# Mondays: refresh project pictures (scripts/fetch-media.mjs). Every 6 hours: rebuild + deploy (picks up new data commits). Needs secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) + CLOUDFLARE_ACCOUNT_ID;
# without them the build still runs and only the deploy is skipped.
# Moving to Cloudflare: once repo variable CF_BUILDS = on, Workers Builds + the recomp-cron worker do all of this
# (scripts/cf/build.mjs, apps/cron) and this workflow only checks pull requests.
name: site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * *'    # daily stats snapshot
    - cron: '23 */6 * * *'  # rebuild
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: site, cancel-in-progress: false }

jobs:
  build:
    if: vars.CF_BUILDS != 'on' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Snapshot GitHub stats
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 5 * * *'
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          node scripts/fetch-stats.mjs
          git config user.name "recomp-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/stats && git commit -m "stats: $(date -u +%F)" && git push || echo "no stats change"
      - run: npm ci
        working-directory: apps/web
      - name: Refresh project pictures (Mondays; only changed pictures are re-made)
        if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '23 5 * * *' && github.event_name == 'schedule')
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          if [ "$(date -u +%u)" = 1 ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            node scripts/fetch-media.mjs
            git add data/media.json apps/web/public/thumbs && git commit -m "media: $(date -u +%F)" && git push || echo "no media change"
          fi
      - run: npm run build
        working-directory: apps/web
      - name: Deploy
        if: github.event_name != 'pull_request' && env.CF_TOKEN_SET == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
      - name: Ping IndexNow
        if: github.event_name != 'pull_request' && env.CF_TOKEN_SET == 'true'
        run: node scripts/indexnow.mjs || true
