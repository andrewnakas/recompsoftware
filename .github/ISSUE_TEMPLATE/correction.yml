name: Correct an entry
description: Something on a recompsoftware.com project page is wrong or out of date
title: "[fix] "
labels: [correction]
body:
  - type: input
    id: page
    attributes: { label: Page, placeholder: "https://recompsoftware.com/p/zelda64recomp/" }
    validations: { required: true }
  - type: textarea
    id: wrong
    attributes: { label: What is wrong, description: "Status, provenance label, licence, platform, links…" }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Source for the correction, description: A public link that shows the right fact }
  - type: dropdown
    id: role
    attributes:
      label: Are you involved with the project?
      options: [No, "Yes, I work on it"]
